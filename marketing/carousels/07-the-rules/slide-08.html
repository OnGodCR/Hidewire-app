<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face { font-family: 'HW Sans'; src: url('../../pipeline/fonts/space-grotesk-400.woff2') format('woff2'); font-weight: 100 450; }
@font-face { font-family: 'HW Sans'; src: url('../../pipeline/fonts/space-grotesk-500.woff2') format('woff2'); font-weight: 451 550; }
@font-face { font-family: 'HW Sans'; src: url('../../pipeline/fonts/space-grotesk-700.woff2') format('woff2'); font-weight: 551 900; }
@font-face { font-family: 'HW Mono'; src: url('../../pipeline/fonts/ibm-plex-mono-400.woff2') format('woff2'); font-weight: 100 500; }
@font-face { font-family: 'HW Mono'; src: url('../../pipeline/fonts/ibm-plex-mono-600.woff2') format('woff2'); font-weight: 501 900; }
[style*="Helvetica"], [style*="system-ui"] { font-family: 'HW Sans', sans-serif !important; }
[style*="monospace"] { font-family: 'HW Mono', monospace !important; }
</style></head>
<body>
<x-dc>
<div style="width:1080px;height:1350px;background:#0A0A0C;color:#F4F4F2;position:relative;overflow:hidden;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">
  <div style="position:absolute;top:48px;left:48px;width:52px;height:52px;border-top:1px solid #2E2E34;border-left:1px solid #2E2E34"></div>
  <div style="position:absolute;top:48px;right:48px;width:52px;height:52px;border-top:1px solid #2E2E34;border-right:1px solid #2E2E34"></div>
  <div style="position:absolute;bottom:48px;left:48px;width:52px;height:52px;border-bottom:1px solid #2E2E34;border-left:1px solid #2E2E34"></div>
  <div style="position:absolute;bottom:48px;right:48px;width:52px;height:52px;border-bottom:1px solid #2E2E34;border-right:1px solid #2E2E34"></div>
  <div style="position:absolute;top:80px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#7A7A82">
    <span>The tag</span>
  </div>
  <div style="position:absolute;left:80px;right:80px;top:190px;height:520px;display:flex;flex-direction:column;justify-content:center;gap:96px">
    <div style="display:flex;align-items:center;gap:28px">
      <div style="width:34px;height:34px;background:#F4F4F2;transform:rotate(45deg)"></div>
      <div style="width:120px;height:2px;background:#C8FF2E"></div>
      <div style="width:34px;height:34px;background:#F4F4F2;transform:rotate(45deg)"></div>
      <div style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:15px;letter-spacing:4px;text-transform:uppercase;color:#7A7A82;margin-left:24px">Tag</div>
    </div>
    <div style="display:flex;align-items:center;gap:28px">
      <div style="width:34px;height:34px;background:#3E3E46;transform:rotate(45deg)"></div>
      <div style="width:600px;height:0;border-top:2px dashed #2E2E34"></div>
      <div style="width:34px;height:34px;background:#3E3E46;transform:rotate(45deg)"></div>
      <div style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:15px;letter-spacing:4px;text-transform:uppercase;color:#7A7A82;margin-left:24px">Nothing</div>
    </div>
  </div>
  <div style="position:absolute;left:80px;right:80px;top:790px">
    <div style="font-size:88px;font-weight:800;line-height:0.94;letter-spacing:-3.5px;text-transform:uppercase">A tag needs<br />real proximity.</div>
    <div style="font-size:34px;line-height:1.35;color:#B9B9B4;margin-top:36px;max-width:860px;text-wrap:pretty">You have to be standing there. Nobody gets caught from across the street.</div>
  </div>
  <div style="position:absolute;left:80px;right:80px;bottom:80px;display:flex;align-items:center;gap:16px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#7A7A82">
    <div style="width:10px;height:10px;background:#7A7A82;transform:rotate(45deg)"></div>
    <span>Confirmed by a device handshake</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1350}}"></script>
</body>
</html>
