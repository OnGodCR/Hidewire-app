<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

<body>
<x-dc>
<div style="width:1080px;height:1350px;background:#0A0A0C;color:#F4F4F2;position:relative;overflow:hidden;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">

  <div style="position:absolute;top:48px;right:48px;width:52px;height:52px;border-top:1px solid #2E2E34;border-right:1px solid #2E2E34"></div>
  <div style="position:absolute;bottom:48px;left:48px;width:52px;height:52px;border-bottom:1px solid #2E2E34;border-left:1px solid #2E2E34"></div>

  <div style="position:absolute;top:80px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#7A7A82">
    <span>Hidewire</span>

  <div style="position:absolute;left:80px;right:80px;top:660px;text-align:center">
    <div style="font-size:78px;font-weight:800;line-height:1.06;letter-spacing:-3px;text-transform:lowercase;color:#F4F4F2">hidewire.org ·<br />get on the list</div>
    <div style="font-size:32px;line-height:1.4;color:#B9B9B4;margin-top:56px;max-width:820px;margin-left:auto;margin-right:auto;text-wrap:pretty">everyone on the list gets a link to an exclusive in-game reward the day it drops</div>
  </div>
  <div style="position:absolute;left:80px;right:80px;bottom:80px;display:flex;justify-content:center;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#7A7A82">
    <span>Hiding isn't enough · prove it</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1350}}"></script>

</html>
